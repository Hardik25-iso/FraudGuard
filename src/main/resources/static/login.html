<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — FraudGuard Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="/style-nexus.css?v=6.1" rel="stylesheet">
</head>
<script>
  const savedTheme = localStorage.getItem('fg-theme') || 'executive';
  if (savedTheme !== 'executive') document.documentElement.setAttribute('data-theme', savedTheme);
</script>
<body class="auth-body">

<nav class="auth-nav" style="width: 100%; border-bottom: none; background: transparent;">
  <div class="brand">
    <i class="fas fa-shield-halved"></i>
    <span>FRAUDGUARD</span>
  </div>
  <a href="/landing.html" class="back-link" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
</nav>

<div class="form-card fade-in">
    <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="font-family: 'Source Serif 4', serif; font-size: 28px; margin-bottom: 8px;">Operator Access</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Connect to the Nexus heuristic engine.</p>
    </div>

    <div id="error-alert" class="d-none" style="padding: 12px; border-radius: 6px; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); font-size: 13px; font-weight: 700; margin-bottom: 20px; text-align: center;"></div>

    <form id="login-form">
        <div class="fg">
            <label class="form-label">OPERATOR USERNAME</label>
            <input type="text" id="username" class="input-field" placeholder="e.g. admin" required>
        </div>
        <div class="fg" style="margin-bottom: 30px;">
            <label class="form-label">ACCESS KEY (PASSWORD)</label>
            <input type="password" id="password" class="input-field" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="action-btn" id="submit-btn">AUTHORIZE & CONNECT</button>
        <div class="back-link" style="margin-top: 24px;">New operator? <a href="/signup.html">Initialize System</a></div>
    </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error-alert');
    const btn = document.getElementById('submit-btn');
    errorEl.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'AUTHENTICATING...';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            window.location.href = '/index.html';
        } else {
            const data = await response.json();
            errorEl.textContent = data.message || 'Authentication failed.';
            errorEl.classList.remove('d-none');
        }
    } catch (err) {
        errorEl.textContent = 'Nexus connection failed.';
        errorEl.classList.remove('d-none');
    } finally {
        btn.disabled = false;
        btn.textContent = 'AUTHORIZE & CONNECT';
    }
});
</script>
</body>
</html>
