spring.application.name=fraudguard

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fraudguarddb?useSSL=false&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Fraud Detection Settings
fraud.rules.large-amount.medium=50000.00
fraud.rules.large-amount.extreme=500000.00
fraud.rules.rapid-fire.threshold=3
fraud.rules.velocity.threshold-multiplier=0.5
fraud.rules.suspicious.dormancy-days=30

# System Paths
fraud.logging.alert-path=logs/fraud-alerts.log
fraud.logging.report-path=logs/fraud-summary-report.txt
